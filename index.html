<!DOCTYPE html>
<!-- translate="no": the app ships its own Arabic/English switcher, so browser
     auto-translation adds nothing — and it actively breaks React. Translators
     replace text nodes with their own <font> wrappers; React keeps a reference
     to the original node, and the next re-render dies with
     "NotFoundError: removeChild — the node to be removed is not a child of this
     node", which is what crashed the signup screen. -->
<html lang="en" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <meta name="description"
    content="AI Video Prompt Architect - Generate comprehensive video production blueprints and reverse-engineer prompts from content" />
  <meta name="theme-color" content="#030712" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <title>Kemo Prompt | Creative AI Engine</title>

  <style>
    /* Critical CSS for faster initial render.

       The background MUST go through --bg-app rather than a fixed colour. This
       rule is unlayered, and unlayered CSS outranks anything in @layer base —
       which is where src/index.css defines `body { bg-bg0 }`. A hardcoded value
       here therefore wins permanently, and light mode was painting near-black
       (#030712) behind every transparent surface: the sign-in screen sat on a
       dark page while using light-theme text.

       The literal stays as the fallback only for the instant before the main
       stylesheet lands, which matches the app's default dark theme. */
    body {
      margin: 0;
      background: var(--bg-app, #030712);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- LemonSqueezy Checkout Overlay -->
  <script src="https://app.lemonsqueezy.com/js/lemon.js" defer></script>
</body>

</html>
