name: CI

# Nothing gated deploys before this: a push went straight to a Coolify rebuild,
# so a syntax error or a broken engine reached production unchallenged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catches syntax errors in server code, which the build never touches.
      - name: Check server syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: server
